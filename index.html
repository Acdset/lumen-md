<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'self' blob: data:;"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="application-name" content="Lumen" />
    <title>Lumen</title>
  </head>
  <body>
    <div id="root"></div>
    <style id="export-css">
      :root {
        --text: #1c1917;
        --border: rgba(28, 25, 23, 0.1);
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --bg-panel: #f0ece5;
        --serif: Georgia, 'Songti SC', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        --mono: ui-monospace, Menlo, monospace;
      }
      .markdown-body {
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.85;
        color: var(--text);
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        font-family: var(--sans);
      }
      .markdown-body a {
        color: var(--accent);
      }
      .markdown-body code {
        font-family: var(--mono);
        background: var(--accent-soft);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      .markdown-body pre {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        overflow: auto;
      }
      .markdown-body pre code {
        background: none;
        padding: 0;
      }
      .markdown-body blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 1em;
        color: #78716c;
      }
      .markdown-body table {
        border-collapse: collapse;
        width: 100%;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border);
        padding: 8px 10px;
      }
      .markdown-body img {
        max-width: 100%;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
